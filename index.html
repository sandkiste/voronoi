<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Voronoi Generator</title>
    <link rel="stylesheet" href="css/style.css">
    
    <script type="module">
        import { Delaunay } from "https://cdn.skypack.dev/d3-delaunay@6";
        window.Delaunay = Delaunay;
    </script>
    
    <script src="js/generator.js" defer></script>
</head>
<body>

    <div class="controls">
        <h2>Lid Grid Parameters</h2>
        
        <div class="control-group">
            <label>Width (mm): <span id="val-w">80</span></label>
            <input type="range" id="width" min="40" max="200" value="80">
        </div>

        <div class="control-group">
            <label>Height (mm): <span id="val-h">60</span></label>
            <input type="range" id="height" min="40" max="200" value="60">
        </div>

        <div class="control-group">
            <label>Cell Count: <span id="val-count">40</span></label>
            <input type="range" id="count" min="10" max="150" value="40">
        </div>

        <div class="control-group">
            <label>Wall Thickness (Gap Factor): <span id="val-gap">0.2</span></label>
            <input type="range" id="gap" min="0.05" max="0.4" step="0.01" value="0.2">
        </div>

        <button id="generate">Regenerate Seeds</button>
        <button id="download" style="background: #34c759;">Download SVG for Fusion</button>
    </div>

    <div class="preview-container">
        <svg id="voronoi-svg" viewBox="0 0 80 60" width="400"></svg>
    </div>

</body>
</html>
